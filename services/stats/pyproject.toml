[project]
name = "stats-service"
version = "0.1.0"
description = "Service stats de StreamLab (FastAPI)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "streamlab-contracts",
    "streamlab-kafka",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
streamlab-contracts = { workspace = true }
streamlab-kafka = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"
