# Infrastructure locale de StreamLab (TD1).
# Les services applicatifs (Python) tournent sur l'hôte avec `pnpm dev`, pas ici.
# Tous les ports sont configurables dans .env (voir .env.example).
#
# Économie de données : versions épinglées, jamais de `latest`.
# `docker compose up` ne télécharge que les images absentes.

name: streamlab

services:
  # ---------------------------------------------------------------------------
  # Kafka 4 en mode KRaft : un seul nœud qui est à la fois broker et controller.
  # Inspiré de l'exemple officiel apache/kafka : docker/examples/.../single-node
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    container_name: streamlab-kafka
    ports:
      # Seul le listener HOST est publié sur la machine hôte.
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Identifiant fixe du cluster (base64, 16 octets) : pratique en local.
      CLUSTER_ID: "c3RyZWFtbGFiLWxvY2FsMQ"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Trois listeners :
      #  - HOST       : pour les clients sur l'hôte (services Python) -> localhost
      #  - DOCKER     : pour les autres conteneurs (Kafbat UI, kafka-init) -> kafka
      #  - CONTROLLER : consensus KRaft interne, jamais annoncé aux clients
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_PORT:-9092},DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Un seul nœud : tous les facteurs de réplication internes valent 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Les consommateurs démarrent sans attendre 3 s de rééquilibrage.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Les topics sont créés explicitement par kafka-init, jamais par erreur.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Kafka est une JVM : on borne le tas pour les machines de 8 Go.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      # On teste via le listener interne : il ne dépend pas de KAFKA_PORT.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Conteneur à usage unique : crée les topics puis s'arrête (Exited 0).
  # Réutilise l'image Kafka (aucun téléchargement supplémentaire).
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:4.3.2
    container_name: streamlab-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVER: kafka:19092
    volumes:
      - ./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Kafbat UI : interface web pour explorer topics, messages et groupes.
  # http://localhost:8080
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.1
    container_name: streamlab-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: streamlab-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: "-Xms128m -Xmx256m"
    mem_limit: 512m
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL : une base + un utilisateur par service (catalog, identity, stats).
  # Le script d'init ne s'exécute qu'au premier démarrage (volume vide).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: streamlab-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_dev}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_dev}
      STATS_DB_PASSWORD: ${STATS_DB_PASSWORD:-stats_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-data:
